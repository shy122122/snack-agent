<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tool 管理 · 零食电商客服后台</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css"/>
<link rel="stylesheet" href="/static/brand.css"/>
<style>
  body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  .mono{font-family:ui-monospace,Consolas,Menlo,monospace}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#e2e8f0;border-radius:4px}
  .fadein{animation:fadein .18s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(2px)}to{opacity:1}}
</style>
</head>
<body class="bg-slate-100 text-slate-800">
<header class="bg-white border-b border-slate-200 sticky top-0 z-20">
  <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center gap-3">
    <div class="w-9 h-9 rounded-xl bg-sky-500 text-white grid place-items-center shadow"><i class="fa fa-wrench text-lg"></i></div>
    <div class="flex-1 min-w-0">
      <h1 class="font-bold leading-tight">Tool 管理</h1>
      <p class="text-xs text-slate-500 truncate">金额/活动/订单一律由这些 Tool 用代码计算 · 测试 = 真实调用服务端</p>
    </div>
    <nav class="flex flex-wrap items-center gap-1 text-sm">
      <a href="/" class="px-3 py-1.5 rounded-lg hover:bg-slate-100">工作台</a>
      <a href="/demo" class="px-3 py-1.5 rounded-lg hover:bg-slate-100">演示</a>
      <a href="/skills" class="px-3 py-1.5 rounded-lg hover:bg-slate-100">技能</a>
      <a href="/tools" class="px-3 py-1.5 rounded-lg bg-sky-100 text-sky-700 font-medium">工具</a>
      <a href="/planner" class="px-3 py-1.5 rounded-lg hover:bg-slate-100">规划器</a>
      <a href="/models" class="px-3 py-1.5 rounded-lg hover:bg-slate-100">模型</a>
    </nav>
  </div>
</header>
<script>if(location.search.indexOf("embed=1")>-1){var _h=document.querySelector("header");if(_h)_h.classList.add("hidden");}</script>

<div class="max-w-6xl mx-auto px-4 py-5">
  <div class="mb-4 flex flex-wrap items-center gap-2 text-xs text-slate-500">
    <button onclick="load()" class="px-3 py-1.5 rounded-lg bg-white border border-slate-200 hover:bg-slate-50"><i class="fa fa-refresh"></i> 刷新</button>
    <span class="text-slate-400">状态：</span>
    <select id="stateFilter" title="启用状态筛选" aria-label="启用状态筛选" class="px-2 py-1.5 rounded-lg bg-white border border-slate-200 focus:outline-none">
      <option value="all">全部</option><option value="on">仅启用</option><option value="off">仅停用</option>
    </select>
    <span class="text-slate-400 hidden sm:inline">说明：停用后 Planner 将无法安排该 Tool；「故障注入」让该 Tool 稳定抛错（演示风控/重试）。</span>
  </div>

  <div id="loadCard" class="hidden bg-white border border-slate-200 rounded-2xl p-8 text-center text-slate-400"><i class="fa fa-circle-o-notch fa-spin"></i> 加载中…</div>
  <div id="errCard" class="hidden bg-white rounded-2xl p-6 shadow-sm ring-2 ring-rose-200 text-sm text-rose-700 whitespace-pre-wrap"></div>
  <div id="emptyCard" class="hidden bg-white border border-slate-200 rounded-2xl p-10 text-center text-slate-400"><i class="fa fa-inbox"></i> 没有 Tool</div>
  <div id="list" class="space-y-4"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(url,method,body){
  const r=await fetch(url,{method:method||"GET",headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||("HTTP "+r.status));
  if(j&&j.ok===false) throw new Error(j.error||"操作失败");
  return j;
}
let tools=[];
function toast(msg,kind){
  const d=document.createElement("div");
  d.className="fixed bottom-4 right-4 z-[60] px-4 py-2 rounded-xl text-sm shadow-lg text-white fadein "+(kind==="err"?"bg-rose-600":"bg-emerald-600");
  d.innerHTML=esc(msg); document.body.appendChild(d); setTimeout(()=>d.remove(),kind==="err"?5000:2600);
}
function showState(){
  const st=$("#stateFilter").value;
  const rows=tools.filter(t=>st==="all"||(st==="on"?t.enabled:!t.enabled));
  $("#emptyCard").classList.toggle("hidden",rows.length!==0);
  render(rows);
}
async function load(){
  $("#loadCard").classList.remove("hidden"); $("#errCard").classList.add("hidden");
  try{ const j=await api("/api/tools"); tools=j.tools; showState(); }
  catch(e){ $("#errCard").textContent="加载失败："+e.message; $("#errCard").classList.remove("hidden"); }
  finally{ $("#loadCard").classList.add("hidden"); }
}
function render(rows){
  const box=$("#list"); box.innerHTML="";
  for(const t of rows){
    const card=document.createElement("div");
    card.className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm fadein min-w-0";
    const paramsHtml=Object.entries(t.params||{}).map(([k,v])=>
      `<span class="px-2 py-1 rounded bg-slate-50 border border-slate-100"><span class="text-slate-400">${esc(k)}</span> <b class="mono">${esc(v)}</b></span>`).join(" ");
    card.innerHTML=`
      <div class="flex flex-wrap items-start gap-3">
        <div class="flex-1 min-w-0">
          <div class="flex flex-wrap items-center gap-2">
            <h3 class="font-semibold">${esc(t.name)}</h3>
            <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-100 text-slate-500 mono">${esc(t.id)}</span>
            <span class="text-[10px] px-1.5 py-0.5 rounded ${t.enabled?"bg-emerald-100 text-emerald-700":"bg-rose-100 text-rose-600"}">${t.enabled?"启用":"停用"}</span>
            ${t.forced?`<span class="text-[10px] px-1.5 py-0.5 rounded bg-rose-100 text-rose-600"><i class="fa fa-bolt"></i> 故障注入中</span>`:""}
          </div>
          <p class="text-xs text-slate-500 mt-1 break-words">${esc(t.description)}</p>
          <p class="text-xs text-slate-400 mt-1">产出：<b class="mono text-slate-600">${esc(t.artifact||"-")}</b> · ${esc(t.output_desc||"")}
            ${t.dep_skills&&t.dep_skills.length?` · 供 Skill：<b class="text-sky-600">${esc(t.dep_skills.join("/"))}</b>`:""}</p>
          <div class="flex flex-wrap gap-1.5 mt-2 text-[11px]">${paramsHtml}</div>
        </div>
        <div class="flex flex-col items-end gap-1.5 shrink-0">
          <label class="inline-flex items-center gap-1.5 text-xs text-slate-500 select-none"><input type="checkbox" class="accent-emerald-600" ${t.enabled?"checked":""} onchange="setFlag('${esc(t.id)}','enabled',this.checked)"/> 启用</label>
          <label class="inline-flex items-center gap-1.5 text-xs text-slate-500 select-none"><input type="checkbox" class="accent-rose-600" ${t.forced?"checked":""} onchange="setFlag('${esc(t.id)}','forced',this.checked)"/> 故障注入</label>
        </div>
      </div>
      <div class="mt-3 border-t border-slate-100 pt-3">
        <p class="text-xs font-medium text-slate-500 mb-1.5">测试调用（真实执行，Inputs 为 JSON）</p>
        <div class="flex flex-col lg:flex-row gap-2">
          <div class="flex-1 min-w-0">
            <textarea data-in="json" rows="4" spellcheck="false" class="mono w-full border border-slate-300 rounded-lg px-2 py-1.5 text-[11px] leading-5 focus:outline-none focus:ring-2 focus:ring-sky-300">${esc(JSON.stringify(t.sample_input||{},null,2))}</textarea>
          </div>
          <div class="flex items-start gap-2">
            <button data-test="run" class="px-3 py-2 rounded-lg bg-sky-600 text-white text-xs font-medium inline-flex items-center gap-1.5 hover:bg-sky-700 disabled:opacity-50"><i class="fa fa-play"></i> 真实调用</button>
            <button data-test="fill" title="用真实数据示例填充" class="px-3 py-2 rounded-lg bg-slate-100 text-slate-600 text-xs hover:bg-slate-200">填示例</button>
          </div>
        </div>
        <div data-result="wrap" class="hidden mt-2"></div>
      </div>`;
    box.appendChild(card);
  }
}
async function setFlag(id,flag,on){
  try{ const j=await api("/api/tools/"+id,"PUT",{[flag]:on}); tools=j.tools; showState(); toast((on?"已开启":"已关闭")+"「"+id+"」的"+ (flag==="forced"?"故障注入":"启用状态"),"ok"); }
  catch(e){ toast(e.message,"err"); load(); }
}
async function runTest(btn){
  const card=btn.closest(".bg-white"); const id=card.querySelector(".mono").textContent.trim();
  const idEl=card.querySelector('h3+span'); const tid=idEl? idEl.textContent.trim():id;
  const resWrap=card.querySelector('[data-result="wrap"]');
  const inputEl=card.querySelector('[data-in="json"]');
  let params={};
  try{ params=JSON.parse(inputEl.value||"{}"); }
  catch(e){ resWrap.classList.remove("hidden");
    resWrap.innerHTML=`<div class="rounded-xl ring-2 ring-rose-200 bg-rose-50 text-rose-700 px-3 py-2 text-xs mono">入参不是合法 JSON：${esc(e.message)}</div>`;
    return; }
  btn.disabled=true; const old=btn.innerHTML; btn.innerHTML='<i class="fa fa-circle-o-notch fa-spin"></i> 调用中…';
  resWrap.classList.remove("hidden");
  resWrap.innerHTML=`<div class="rounded-xl bg-slate-50 border border-slate-200 px-3 py-2 text-xs text-slate-400"><i class="fa fa-circle-o-notch fa-spin"></i> 正在真实执行 Tool…</div>`;
  const res=await fetch("/api/tools/"+tid+"/test",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({inputs:params})});
  const j=await res.json().catch(()=>({}));
  btn.disabled=false; btn.innerHTML=old;
  const succeeded=res.ok&&j.ok&&!j.error;
  const errText=(!res.ok?j.error:"")||(j.error||"");
  const outHtml=errText? `<div class="rounded-xl ring-2 ring-rose-200 bg-rose-50 text-rose-700 px-3 py-2 text-xs whitespace-pre-wrap">执行结果带错：${esc(errText)}</div>`
    : `<pre class="mono rounded-xl bg-slate-900 text-emerald-200 px-3 py-2 text-[11px] leading-5 whitespace-pre-wrap overflow-auto max-h-72">${esc(JSON.stringify(j.output,null,2))}</pre>`;
  resWrap.innerHTML=`
    <div class="flex flex-wrap items-center gap-2 text-xs mb-1.5">
      <span class="px-2 py-0.5 rounded-full ${succeeded?"bg-emerald-100 text-emerald-700":"bg-rose-100 text-rose-600"}">${succeeded?"<i class='fa fa-check-circle'></i> 成功（服务端返回真实结果）":"<i class='fa fa-exclamation-triangle'></i> 未成功（服务端如实报错）"}</span>
      <span class="text-slate-400">latency <b class="mono">${j.latency_ms??"-"}ms</b></span>
      <button class="ml-auto text-slate-400 hover:text-slate-600" aria-label="收起结果" title="收起" onclick="this.closest('[data-result=wrap]').classList.add('hidden')"><i class="fa fa-times"></i></button>
    </div>${outHtml}`;
}
document.addEventListener("click",e=>{
  const fill=e.target.closest('[data-test="fill"]');
  if(fill){ const c=fill.closest(".bg-white"); const ta=c.querySelector('[data-in="json"]');
    // 取该卡所属 tool 的 sample_input：从当前行第一个 mono id 查 state
    const id=(c.querySelector('span.mono')||{}).textContent||"";
    const t=tools.find(x=>x.id===id); if(t) ta.value=JSON.stringify(t.sample_input||{},null,2); }
  const run=e.target.closest('[data-test="run"]');
  if(run) runTest(run);
});
$("#stateFilter").addEventListener("change",showState);
load();
</script>
</body>
</html>
