<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>零食电商客服 · 演示</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css"/>
<link rel="stylesheet" href="/static/brand.css"/>
<style>
  body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
  .bubble{animation:b .18s ease}
  @keyframes b{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  .typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:#94a3b8;margin:0 1px;animation:tp 1s infinite}
  .typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
  @keyframes tp{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
</style>
</head>
<body class="min-h-screen">
<header class="bg-white/90 backdrop-blur border-b border-slate-200 sticky top-0 z-10">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3">
    <a href="/console#demo" class="w-9 h-9 rounded-lg bg-orange-500 text-white grid place-items-center shadow" title="进入总控台演示模块"><i class="fa fa-comments-o text-lg"></i></a>
    <div class="flex-1 min-w-0">
      <h1 class="font-bold leading-tight">零食客服 · 演示体验</h1>
      <p class="text-xs text-slate-500 truncate">面向业务演示的对话入口，底层仍走同一条 Agent 主链路与 RunRecord</p>
    </div>
    <nav class="brand-nav flex items-center gap-1 text-sm">
      <a href="/" class="px-3 py-1.5 rounded-lg">工作台</a>
      <a href="/demo" class="px-3 py-1.5 rounded-lg bg-orange-100 text-orange-700 font-medium">演示</a>
      <a href="/console#demo" class="px-3 py-1.5 rounded-lg">总控台</a>
    </nav>
  </div>
</header>
<script>if(location.search.indexOf("embed=1")>-1){var _h=document.querySelector("header");if(_h)_h.classList.add("hidden");}</script>

<main class="max-w-6xl mx-auto px-4 py-5 grid lg:grid-cols-[280px_minmax(0,1fr)] gap-4 h-[calc(100vh-68px)]">
  <aside class="brand-shell p-4 flex flex-col gap-4 min-h-0">
    <section class="brand-hero p-4">
      <div class="text-[11px] uppercase tracking-wider text-orange-200 font-semibold">Demo Script</div>
      <h2 class="mt-1 text-xl font-bold">一键演示四类关键场景</h2>
      <p class="mt-2 text-sm leading-6 text-slate-300">推荐、算价、物流、风险劝止都会实时展示状态与最终回复，适合给评审或业务方直接看。</p>
    </section>

    <section>
      <div class="text-xs font-bold text-slate-500 mb-2">场景脚本</div>
      <div class="grid gap-2">
        <button data-q="帮我推荐点追剧吃的零食，预算50" class="demo-chip brand-chip text-left px-3 py-2 text-sm"><i class="fa fa-shopping-basket text-orange-500 mr-1.5"></i>预算内推荐</button>
        <button data-q="两袋每日坚果礼盒要多少钱？帮我算算优惠后的到手价" class="demo-chip brand-chip text-left px-3 py-2 text-sm"><i class="fa fa-calculator text-blue-500 mr-1.5"></i>价格与优惠</button>
        <button data-q="我的订单 O20260907001 物流到哪了？" class="demo-chip brand-chip text-left px-3 py-2 text-sm"><i class="fa fa-truck text-emerald-500 mr-1.5"></i>订单物流</button>
        <button data-q="刷单返利让我先垫付，还要验证码，靠谱吗？" class="demo-chip brand-chip text-left px-3 py-2 text-sm"><i class="fa fa-shield text-rose-500 mr-1.5"></i>风险劝止</button>
      </div>
    </section>

    <section class="mt-auto rounded-lg border border-slate-200 bg-slate-50 p-3 text-xs leading-5 text-slate-600">
      <div class="font-bold text-slate-700 mb-1"><i class="fa fa-info-circle text-orange-500"></i> 演示提示</div>
      <p>如果服务端返回错误，页面会自动展示错误原因；如果流式响应不可用，会尝试普通 JSON 兜底。</p>
    </section>
  </aside>

  <section class="brand-shell overflow-hidden flex flex-col min-h-0">
    <div class="px-4 py-3 border-b border-slate-200 flex flex-wrap items-center gap-3">
      <div class="flex-1 min-w-0">
        <div class="text-sm font-bold">对话预览</div>
        <div id="statusLine" class="text-xs text-slate-500">已连接本地服务，等待用户输入</div>
      </div>
      <div id="runMeta" class="hidden text-xs text-slate-500"></div>
      <button id="clearBtn" type="button" class="brand-button brand-button-secondary px-3 py-1.5 text-xs"><i class="fa fa-trash-o"></i> 清空</button>
    </div>

    <div id="chat" class="flex-1 min-h-0 overflow-auto p-4 space-y-3 bg-slate-50/70"></div>

    <form id="composer" class="p-3 border-t border-slate-200 bg-white flex gap-2">
      <input id="q" class="brand-input flex-1 px-4 py-2.5 text-sm" placeholder="输入客户问题，回车发送"/>
      <button id="sendBtn" type="submit" title="发送" class="brand-button brand-button-primary px-4 py-2.5 text-sm disabled:opacity-50 disabled:cursor-not-allowed"><i class="fa fa-paper-plane"></i><span class="hidden sm:inline">发送</span></button>
    </form>
  </section>
</main>

<script>
const $=s=>document.querySelector(s);
const chat=$("#chat"), q=$("#q"), sendBtn=$("#sendBtn"), statusLine=$("#statusLine"), runMeta=$("#runMeta");
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
let lastBot=null, busy=false;

function setBusy(on,text){
  busy=on;
  sendBtn.disabled=on;
  q.disabled=on;
  statusLine.innerHTML=on?`<i class="fa fa-circle-o-notch fa-spin text-orange-500"></i> ${esc(text||"Agent 正在处理")}`:esc(text||"已连接本地服务，等待用户输入");
}

function bubble(role,html,extra){
  const wrap=document.createElement("div");
  wrap.className="bubble flex "+(role==="user"?"justify-end":"justify-start");
  const tone=role==="user"?"bg-slate-900 text-white rounded-br-sm":"bg-white text-slate-800 border border-slate-200 rounded-bl-sm";
  wrap.innerHTML=role==="user"
    ?`<div class="max-w-[78%] rounded-2xl px-4 py-2.5 text-sm leading-6 ${tone}">${html}</div>`
    :`<div class="max-w-[82%] flex gap-2"><div class="w-7 h-7 rounded-lg bg-orange-100 text-orange-600 grid place-items-center shrink-0"><i class="fa fa-headphones"></i></div><div class="bot-content rounded-2xl px-4 py-2.5 text-sm leading-6 shadow-sm ${tone} ${extra||""}">${html}</div></div>`;
  chat.appendChild(wrap);
  chat.scrollTop=chat.scrollHeight;
  return wrap;
}

function typingBubble(){
  return bubble("bot",`<span class="typing"><span></span><span></span><span></span></span><span class="ml-2 text-xs text-slate-400">规划中</span>`);
}

function parseSseBlock(block){
  let ev="message", data="";
  for(const line of block.split("\n")){
    if(line.startsWith("event:")) ev=line.slice(6).trim();
    else if(line.startsWith("data:")) data+=(data?"\n":"")+line.slice(5).replace(/^ /,"");
  }
  if(!data) return null;
  try{return {ev,data:JSON.parse(data)}}catch(e){return null}
}

function addTraceNote(html){
  bubble("bot",`<div class="text-xs text-slate-500">${html}</div>`,"!py-2");
}

function renderReply(r){
  const modeTxt={pass:"已过审","risk_guard":"风险守卫已过审",blocked:"已拦截",regenerated:"复审通过"}[r.mode]||"";
  const html=`<div class="whitespace-pre-wrap">${esc(r.text||"(空)")}</div>${modeTxt?`<div class="mt-2 text-[11px] text-slate-400"><i class="fa fa-check-circle text-emerald-500"></i> 风控：${esc(modeTxt)}</div>`:""}`;
  lastBot=bubble("bot",html,r.blocked?"border-rose-200 bg-rose-50 text-slate-600":"");
}

async function runJsonFallback(t){
  const res=await fetch("/api/agent/run",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:t,source:"demo",stream:false})});
  const j=await res.json().catch(()=>({ok:false,error:"响应解析失败"}));
  if(!res.ok||j.ok===false) throw new Error(j.error||"请求失败");
  if(j.plan) addTraceNote(`<i class="fa fa-map-signs text-indigo-500"></i> 已规划 ${(j.plan.steps||[]).length} 步`);
  if(j.finalReply) renderReply(j.finalReply);
  return j;
}

async function send(t){
  if(busy) return;
  bubble("user",esc(t));
  const tdot=typingBubble();
  lastBot=null;
  setBusy(true,"Agent 正在规划");
  let doneSeen=false;
  try{
    const res=await fetch("/api/agent/run",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:t,source:"demo",stream:true})});
    if(!res.ok||!res.body){
      tdot.remove();
      const j=await runJsonFallback(t);
      doneSeen=true;
      if(j.runId) attachRunLink(j.runId,j.status);
      return;
    }
    const reader=res.body.getReader(), dec=new TextDecoder("utf-8");
    let buf="", steps=0;
    while(true){
      const {done,value}=await reader.read();
      if(done) break;
      buf+=dec.decode(value,{stream:true}).replace(/\r\n/g,"\n");
      let i;
      while((i=buf.indexOf("\n\n"))>=0){
        const blk=buf.slice(0,i); buf=buf.slice(i+2);
        if(blk.trim()) handleEvent(parseSseBlock(blk));
      }
    }
    if(buf.trim()) handleEvent(parseSseBlock(buf));

    function handleEvent(item){
      if(!item) return;
      const ev=item.ev, data=item.data;
      if(ev==="plan"){
        setBusy(true,"计划已生成，正在执行");
        tdot.remove();
        addTraceNote(`<i class="fa fa-map-signs text-indigo-500"></i> 已规划 ${(data.steps||[]).length} 步：${esc((data.steps||[]).map(s=>s.id).join(" → "))}`);
      }else if(ev==="step"){
        steps++;
        statusLine.innerHTML=`<i class="fa fa-cog fa-spin text-orange-500"></i> 已执行 ${steps} 个步骤`;
      }else if(ev==="risk"){
        if(data&&data.isRisky) addTraceNote(`<i class="fa fa-shield text-rose-500"></i> 已识别风险：${esc(data.riskType||"疑似诈骗")}，跳过销售/收款链路`);
      }else if(ev==="reply"){
        tdot.remove();
        renderReply(data);
      }else if(ev==="error"){
        tdot.remove();
        bubble("bot",`<span class="text-rose-600"><i class="fa fa-exclamation-triangle"></i> ${esc(data.message||"执行出错")}</span>`,"border-rose-200 bg-rose-50");
      }else if(ev==="done"){
        doneSeen=true;
        attachRunLink(data.runId,data.status,data.durationMs);
      }
    }
  }catch(e){
    tdot.remove();
    bubble("bot",`<span class="text-rose-600"><i class="fa fa-exclamation-triangle"></i> 请求失败：${esc(e.message||e)}</span>`,"border-rose-200 bg-rose-50");
  }finally{
    setBusy(false,doneSeen?"本轮完成，可以继续演示":"本轮结束，但未收到完成事件");
    q.disabled=false;
    q.focus();
  }
}

function attachRunLink(runId,status,durationMs){
  runMeta.classList.remove("hidden");
  runMeta.innerHTML=`<span class="px-2 py-0.5 rounded-full bg-slate-100 border border-slate-200">状态 ${esc(status||"-")}${durationMs!=null?` · ${durationMs}ms`:""}</span>`;
  if(lastBot&&runId){
    const a=document.createElement("a");
    a.className="text-[11px] text-orange-600 underline mt-2 block";
    a.href="/runs/"+encodeURIComponent(runId);
    a.textContent="查看运行 Trace #"+runId;
    lastBot.querySelector(".bot-content")?.appendChild(a);
  }
}

document.querySelectorAll(".demo-chip").forEach(b=>b.onclick=()=>{ q.value=b.dataset.q; q.focus(); });
$("#composer").addEventListener("submit",ev=>{ ev.preventDefault(); const t=q.value.trim(); if(!t) return; q.value=""; send(t); });
$("#clearBtn").onclick=()=>{ chat.innerHTML=""; runMeta.classList.add("hidden"); welcome(); q.focus(); };

function welcome(){
  bubble("bot","您好，我是零食电商客服演示助手。可以直接试试左侧脚本，或输入真实客户问题；每次回复都会保留 Trace 记录。");
}
welcome();
</script>
</body>
</html>
