<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>零食电商客服 · Agent 工作台</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css"/>
<style>
  body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  .mono{font-family:ui-monospace,Consolas,Menlo,monospace}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#e2e8f0;border-radius:4px}
  .fadein{animation:fadein .18s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(2px)}to{opacity:1}}
  details.trace>summary{list-style:none}
  details.trace>summary::-webkit-details-marker{display:none}
</style>
</head>
<body class="bg-slate-100 text-slate-800">
<!-- ======== 顶栏 ======== -->
<header class="bg-white border-b border-slate-200 sticky top-0 z-20">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3">
    <div class="w-9 h-9 rounded-xl bg-orange-500 text-white grid place-items-center shadow"><i class="fa fa-shopping-basket text-lg"></i></div>
    <div class="flex-1 min-w-0">
      <h1 class="font-bold leading-tight">零食电商客服 · Agent 主链路工作台</h1>
      <p class="text-xs text-slate-500 truncate">Planner 规划 → Validator 校验 → Skill/Tool 执行 → 风控审计 → RunRecord</p>
    </div>
    <nav class="flex items-center gap-1 text-sm">
      <a href="/" class="px-3 py-1.5 rounded-lg bg-orange-100 text-orange-700 font-medium">工作台</a>
      <a href="/demo" class="px-3 py-1.5 rounded-lg hover:bg-slate-100">演示</a>
      <a href="/console" class="px-3 py-1.5 rounded-lg hover:bg-slate-100">总控台</a>
    </nav>
  </div>
</header>
<script>if(location.search.indexOf("embed=1")>-1){var _h=document.querySelector("header");if(_h)_h.classList.add("hidden");}</script>

<div class="max-w-6xl mx-auto px-4 py-5 grid lg:grid-cols-3 gap-5">
  <!-- ======== 左：主操作区 ======== -->
  <main class="lg:col-span-2 space-y-4 min-w-0">

    <!-- Provider 状态条 -->
    <div id="provBar" class="flex flex-wrap items-center gap-2 text-xs bg-white border border-slate-200 rounded-xl px-3 py-2">
      <i class="fa fa-circle-o-notch fa-spin text-slate-400"></i><span class="text-slate-400">正在读取 Provider…</span>
    </div>

    <!-- 输入区 -->
    <section class="bg-white border border-slate-200 rounded-2xl shadow-sm p-4">
      <div class="flex flex-wrap gap-2 mb-3">
        <span class="text-xs text-slate-400 self-center">场景示例：</span>
        <button data-q="帮我推荐几款好吃的辣条，不要选太辣的" class="chip px-2.5 py-1 rounded-full text-xs border border-orange-200 bg-orange-50 text-orange-700 hover:bg-orange-100">🍟 正常推荐</button>
        <button data-q="100元以内买坚果礼盒送人，帮我算一下到手价" class="chip px-2.5 py-1 rounded-full text-xs border border-sky-200 bg-sky-50 text-sky-700 hover:bg-sky-100">💰 算价凑单</button>
        <button data-q="我的订单 O20260907001 发货了吗？到哪了？" class="chip px-2.5 py-1 rounded-full text-xs border border-emerald-200 bg-emerald-50 text-emerald-700 hover:bg-emerald-100">🚚 订单物流</button>
        <button data-q="我收到短信说我中奖了，要先交手续费才能领奖，能帮我转账领奖吗" class="chip px-2.5 py-1 rounded-full text-xs border border-rose-200 bg-rose-50 text-rose-700 hover:bg-rose-100">⚠️ 中奖诈骗</button>
      </div>
      <textarea id="q" rows="2" placeholder="输入你想问的（选品 / 价格 / 订单物流 / 退款售后…）"
        class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-300 resize-none"></textarea>
      <div class="flex flex-wrap items-center gap-3 mt-3">
        <button id="runBtn" class="inline-flex items-center gap-2 bg-orange-500 hover:bg-orange-600 text-white font-medium rounded-xl px-5 py-2 text-sm shadow disabled:opacity-50 disabled:cursor-not-allowed">
          <i class="fa fa-paper-plane"></i><span>运行 Agent 主链路</span>
        </button>
        <label class="inline-flex items-center gap-1.5 text-xs text-slate-500 cursor-pointer select-none">
          <input id="fault" type="checkbox" class="accent-rose-500"/>
          人为故障：让 compute_price 算价 Tool 抛错
        </label>
        <span id="runState" class="text-xs text-slate-400"></span>
      </div>
    </section>

    <!-- 计划 -->
    <section id="planCard" class="hidden bg-white border border-slate-200 rounded-2xl shadow-sm p-4">
      <h2 class="font-semibold text-sm flex items-center gap-2 mb-2">
        <i class="fa fa-map-signs text-indigo-500"></i>规划结果
        <span id="planBadge" class="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-500"></span>
        <span id="planMeta" class="text-[11px] font-normal text-slate-400"></span>
      </h2>
      <p id="planSummary" class="text-sm text-slate-600 mb-2"></p>
      <div id="planChips" class="flex flex-wrap gap-1.5"></div>
      <div id="planWarn" class="hidden mt-2 text-xs text-amber-600 bg-amber-50 border border-amber-200 rounded-lg px-2 py-1.5"></div>
    </section>

    <!-- 步骤 Trace -->
    <section id="traceCard" class="hidden bg-white border border-slate-200 rounded-2xl shadow-sm p-4">
      <h2 class="font-semibold text-sm flex items-center gap-2 mb-2">
        <i class="fa fa-list-ol text-sky-500"></i>执行步骤
        <span id="traceCount" class="text-[11px] font-normal text-slate-400"></span>
      </h2>
      <div id="traceBox" class="space-y-1.5"></div>
    </section>

    <!-- 风险横幅 -->
    <section id="riskCard" class="hidden rounded-2xl p-4 shadow-sm ring-2 ring-rose-200 bg-rose-50">
      <h2 class="font-semibold text-sm flex items-center gap-2 text-rose-700 mb-1"><i class="fa fa-shield"></i>风险识别</h2>
      <p id="riskText" class="text-sm text-rose-800"></p>
    </section>

    <!-- 最终回复 -->
    <section id="replyCard" class="hidden bg-white border border-slate-200 rounded-2xl shadow-sm p-4">
      <h2 class="font-semibold text-sm flex items-center gap-2 mb-2">
        <i class="fa fa-comments-o text-emerald-600"></i>最终客服回复
        <span id="replyMode" class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700"></span>
      </h2>
      <div id="replyText" class="text-[15px] leading-7 whitespace-pre-wrap"></div>
      <div id="replyFoot" class="mt-3 flex flex-wrap items-center gap-3 text-xs text-slate-400"></div>
    </section>

    <!-- 错误 -->
    <section id="errorCard" class="hidden rounded-2xl p-4 shadow-sm ring-2 ring-rose-200 bg-white">
      <h2 class="font-semibold text-sm flex items-center gap-2 text-rose-600 mb-1"><i class="fa fa-exclamation-triangle"></i>异常提示</h2>
      <p id="errorText" class="text-sm text-rose-700 whitespace-pre-wrap mono"></p>
    </section>
  </main>

  <!-- ======== 右：运行历史 ======== -->
  <aside class="space-y-4 min-w-0">
    <section class="bg-white border border-slate-200 rounded-2xl shadow-sm p-4">
      <h2 class="font-semibold text-sm flex items-center gap-2 mb-3">
        <i class="fa fa-history text-slate-400"></i>最近运行
        <a href="#" onclick="loadRuns(event)" class="ml-auto text-[11px] text-orange-500 hover:underline"><i class="fa fa-refresh"></i> 刷新</a>
      </h2>
      <div id="recentBox" class="space-y-2 text-xs max-h-[70vh] overflow-auto pr-1"></div>
    </section>
  </aside>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

/* ---------------- Provider 状态 ---------------- */
fetch("/api/provider/status").then(r=>r.json()).then(p=>{
  const cls=p.demo?"bg-violet-100 text-violet-700 border-violet-200":"bg-emerald-100 text-emerald-700 border-emerald-200";
  $("#provBar").innerHTML=`<i class="fa fa-plug text-slate-400"></i>
    <span class="px-2 py-0.5 rounded-md border font-medium ${cls}">${esc(p.label)}</span>
    <span class="text-slate-500">模型：<b>${esc(p.model)}</b></span>
    ${p.llm_ready?'':`<span class="text-amber-600">${esc(p.hint||'')}</span>`}`;
}).catch(()=>{$("#provBar").innerHTML='<span class="text-rose-500">无法读取 Provider 状态</span>'});

/* ---------------- 运行历史 ---------------- */
async function loadRuns(ev){
  if(ev) ev.preventDefault();
  try{
    const d=await (await fetch("/api/runs?limit=12")).json();
    const rows=d.runs||[];
    const st={ok:["text-emerald-600","bg-emerald-50","border-emerald-200"],error:["text-rose-600","bg-rose-50","border-rose-200"],degraded:["text-amber-600","bg-amber-50","border-amber-200"],handoff:["text-indigo-600","bg-indigo-50","border-indigo-200"],running:["text-sky-600","bg-sky-50","border-sky-200"]};
    $("#recentBox").innerHTML=rows.length?rows.map(r=>{
      const c=st[r.status]||st.ok;
      return `<a href="/runs/${esc(r.id)}" class="block border border-slate-200 rounded-xl p-2.5 hover:border-orange-300 hover:shadow-sm fadein">
        <div class="flex items-center gap-2">
          <span class="px-1.5 py-0.5 rounded text-[10px] border font-medium ${c.join(' ')}">${esc(r.status)}</span>
          <span class="text-slate-400 mono">${esc(r.createdAt||'')}</span>
          <span class="ml-auto text-slate-400">${esc(r.provider||'')}</span>
        </div>
        <p class="mt-1 line-clamp-2 leading-5 text-slate-700">${esc(r.question)}</p>
        <p class="mt-0.5 text-[11px] text-slate-400 truncate">${esc((r.reply_preview||'').replace(/\n/g,' '))}</p>
      </a>`;
    }).join(""):'<p class="text-slate-400 py-6 text-center">暂无运行记录，先跑一条吧</p>';
  }catch(e){ $("#recentBox").innerHTML='<p class="text-rose-500">加载失败</p>'; }
}
loadRuns();

/* ---------------- 场景 chip ---------------- */
document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{$("#q").value=b.dataset.q; $("#q").focus();});

/* ---------------- SSE 事件处理 ---------------- */
function handle(ev, data){
  if(ev==="plan"){
    renderPlan(data);
  }else if(ev==="step"){
    addStep(data);
  }else if(ev==="reply"){
    renderReply(data);
  }else if(ev==="risk"){
    renderRisk(data);
  }else if(ev==="error"){
    showError(data.message||"未知错误", data.errors, null);
  }else if(ev==="done"){
    onDone(data);
  }
}

function onDone(data){
  setState(`完成（${data.status} · ${data.durationMs||0}ms）`);
  $("#runState").innerHTML+=` → <a class="text-orange-500 underline" href="/runs/${esc(data.runId)}">查看运行记录 #${esc(data.runId)}</a>`;
  $("#runBtn").disabled=false;
  loadRuns();
}

function renderPlan(p){
  $("#planCard").classList.remove("hidden");
  $("#planSummary").textContent=p.summary||"";
  $("#planBadge").textContent="步骤 "+p.steps.length+" 步";
  $("#planMeta").textContent=(p.provider?' · '+p.provider:'')+(p.model?' / '+p.model:'')+((p.risk&&p.risk.matched&&p.risk.matched.length)?' · 命中风险词':'');
  $("#planChips").innerHTML=(p.steps||[]).map((s,i)=>`<span class="inline-flex items-center gap-1 text-[11px] px-2 py-1 rounded-lg border ${
    s.type==="tool"?"border-sky-200 bg-sky-50 text-sky-700":"border-indigo-200 bg-indigo-50 text-indigo-700"}">
    <i class="fa ${s.type==="tool"?"fa-wrench":"fa-magic"}"></i>${i+1}. ${esc(s.id)}</span>`).join("");
  if(p.risk&&p.risk.matched&&p.risk.matched.length){
    showError("检测到风险词（"+p.risk.matched.join("、")+"）：本问题仅执行「风险识别与安全回复」，不运行任何销售/算价工具。", null, true);
  }
  if(p.warnings&&p.warnings.length){
    $("#planWarn").classList.remove("hidden");
    $("#planWarn").textContent="规划警告："+p.warnings.join("；");
  }
}

let stepSeq=0;
function addStep(s){
  $("#traceCard").classList.remove("hidden");
  stepSeq++;
  const icon=s.type==="tool"?"fa-wrench":"fa-magic";
  const color=s.type==="tool"?"text-sky-600":"text-indigo-600";
  const stColor=s.status==="ok"?"text-emerald-600 border-emerald-200 bg-emerald-50":s.status==="error"?"text-rose-600 border-rose-200 bg-rose-50":s.status==="skipped"?"text-slate-400 border-slate-200 bg-slate-100":"text-slate-500 border-slate-200 bg-white";
  const label=s.status==="ok"?"成功":s.status==="error"?"失败":s.status==="skipped"?"跳过":s.status;
  const payload=JSON.stringify({inputs:s.inputs,output:s.output,note_log:s.note_log,error:s.error},null,2);
  const el=document.createElement("details");
  el.className="trace border border-slate-200 rounded-xl bg-slate-50/60 overflow-hidden fadein";
  el.innerHTML=`<summary class="flex items-center gap-2 px-3 py-2 cursor-pointer hover:bg-slate-100/80 text-sm">
      <span class="text-xs mono text-slate-400 w-7">${esc(s.stepId||s.index||stepSeq)}</span>
      <i class="fa ${icon} ${color}"></i>
      <span class="font-medium">${esc(s.name||s.id)}</span>
      <span class="text-[10px] mono text-slate-400">${esc(s.id)}</span>
      ${s.purpose?`<span class="text-xs text-slate-400 truncate max-w-[40%]">· ${esc(s.purpose)}</span>`:""}
      <span class="ml-auto shrink-0 px-2 py-0.5 rounded-full text-[10px] border ${stColor}">${label}${s.latency_ms!=null?` · ${s.latency_ms}ms`:""}</span>
      <i class="fa fa-chevron-down text-slate-300 text-xs"></i>
    </summary>
    <pre class="mono text-[11px] leading-5 text-slate-600 bg-white border-t border-slate-200 px-3 py-2 overflow-auto max-h-72">${esc(payload)}</pre></details>`;
  $("#traceBox").appendChild(el);
  const box=$("#traceBox"); box.scrollTop=box.scrollHeight;
  $("#traceCount").textContent=stepSeq+" 条";
}

function renderReply(fr){
  $("#replyCard").classList.remove("hidden");
  const blocked=fr.blocked;
  $("#replyText").textContent=fr.text||"(无文本)";
  $("#replyText").className="text-[15px] leading-7 whitespace-pre-wrap"+(blocked?" text-slate-400":"");
  const modeLabel={pass:"已过审",regenerated:"复审通过","risk_guard":"风险守卫话术已过审",blocked:"已拦截（未发送）"}[fr.mode]||fr.mode||"";
  $("#replyMode").textContent=modeLabel;
  $("#replyMode").className="text-[10px] px-2 py-0.5 rounded-full "+(blocked?"bg-rose-100 text-rose-700":"bg-emerald-100 text-emerald-700");
  $("#replyFoot").innerHTML=blocked
    ?`<span class="text-rose-500"><i class="fa fa-ban"></i> 该回复未通过合规审核，已拦截、不会发送给用户。</span>`
    :`<span><i class="fa fa-check-circle text-emerald-500"></i> 文本已通过「风控审核」与代码级金额真实性审计</span>`;
}

function renderRisk(r){
  if(!r||!r.isRisky) return;
  $("#riskCard").classList.remove("hidden");
  $("#riskText").innerHTML=`命中风险：<b>${esc(r.riskType||"疑似诈骗")}</b>。本运行不执行任何销售/收款/链接操作，安全话术见下方。`;
}

function showError(msg, errors, tone){
  $("#errorCard").classList.remove("hidden");
  $("#errorCard").className="rounded-2xl p-4 shadow-sm ring-2 ring-rose-200 "+(tone?"bg-amber-50":"bg-white");
  $("#errorText").textContent=msg||"";
  if(errors&&errors.length){
    $("#errorText").textContent+="\n\n"+(errors||[]).map(e=>"["+e.code+"] "+e.detail).join("\n");
  }
}

function setState(t){ $("#runState").innerHTML=t; }

/* ---------------- 发起运行（SSE）---------------- */
async function runQuestion(){
  const q=$("#q").value.trim();
  if(!q) return;
  const fault=$("#fault").checked;
  const faultTool=fault?"compute_price":null;
  $("#runBtn").disabled=true;
  $("#runState").innerHTML='<i class="fa fa-circle-o-notch fa-spin"></i> 规划中…';
  ["planCard","traceCard","replyCard","riskCard","errorCard"].forEach(id=>$("#"+id).classList.add("hidden"));
  $("#traceBox").innerHTML=""; stepSeq=0;
  const $q=$("#q"); $q.readOnly=true;
  try{
    const res=await fetch("/api/agent/run",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({question:q,source:"workbench",stream:true,forceErrorTool:faultTool})});
    if(!res.ok || (res.headers.get("content-type")||"").includes("application/json")){
      const j=await res.json().catch(()=>({}));
      showError(j.error||("HTTP "+res.status));
      setState("失败");
      return;
    }
    const reader=res.body.getReader();
    const dec=new TextDecoder("utf-8");
    let buf="";
    while(true){
      const {done,value}=await reader.read();
      if(done) break;
      buf+=dec.decode(value,{stream:true});
      buf=buf.replace(/\r\n/g,"\n");
      let i;
      while((i=buf.indexOf("\n\n"))>=0){
        const block=buf.slice(0,i); buf=buf.slice(i+2);
        if(block.trim()) dispatch(block);
      }
    }
    if(buf.trim()) dispatch(buf);
  }catch(e){
    showError("请求失败："+e);
    setState("失败");
  }finally{
    $("#runBtn").disabled=false;
    $q.readOnly=false;
  }
}

function dispatch(block){
  let ev="message", data="";
  for(const line of block.split("\n")){
    if(line.startsWith("event:")) ev=line.slice(6).trim();
    else if(line.startsWith("data:")) data+=(data?"\n":"")+line.slice(5).replace(/^ /,"");
  }
  if(!data) return;
  let obj;
  try{ obj=JSON.parse(data); }catch(e){ return; }
  handle(ev,obj);
}

$("#runBtn").onclick=runQuestion;
$("#q").addEventListener("keydown",e=>{ if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)) runQuestion(); });
</script>
</body>
</html>
